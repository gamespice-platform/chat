[plugin]

name="gs-chat"
description="Text chat as a server-authoritative system: channels with an audience rule, sanitisation that survives markup and invisible characters, rate and repetition limits, command prefixes, per-channel scrollback and a backlog for joining players. Consults gs-moderation's gag source without importing it. Depends only on gs-core."
author="dot"
version="0.1.0"
script="gs_chat_plugin.gd"
